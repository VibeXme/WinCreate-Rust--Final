[package]
name = "wincreate-studio"
version = "7.0.0"
description = "WinCreate Studio: a native Rust drawing and animation app"
authors = ["WinCreate"]
edition = "2021"
rust-version = "1.81"
default-run = "wincreate-studio"

[[bin]]
name = "wincreate-studio"
path = "src/main.rs"

[lib]
name = "wincreate"
path = "src/lib.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
directories = "5"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
