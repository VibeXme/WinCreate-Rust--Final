[package]
name = "wincreate-studio"
version = "6.6.0"
description = "WinCreate Studio desktop drawing app (Rust / Tauri edition)"
authors = ["WinCreate"]
edition = "2021"
rust-version = "1.77.2"
default-run = "wincreate-studio"

[lib]
name = "wincreate_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "wincreate-studio"
path = "src/main.rs"

[[bin]]
name = "wincreate-server"
path = "src/bin/server.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
